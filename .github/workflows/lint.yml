name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint HTML, CSS, and JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Node.js is used only to install and run the linters (the app itself runs on LAMP)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install lint tools
        run: npm ci

      # Each lint step runs even if an earlier one fails, so one run reports every problem
      - name: Lint HTML (HTMLHint)
        run: npm run lint:html

      - name: Lint CSS (Stylelint)
        if: success() || failure()
        run: npm run lint:css

      - name: Lint JavaScript (ESLint)
        if: success() || failure()
        run: npm run lint:js
